<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="reservation">
        <div class="reservation_inner">
            <img class="locked_reservation" src="./imgs/close.png" alt="">
            <div class="reservation_info">
                <img src="./imgs/logo_for_reservation.png" alt="">

                <h2>ЗАБРОНИРОВАТЬ СТОЛИК</h2>
                
                <form>
                    <input class="big_inp" type="text" placeholder="Имя">
                    <input class="big_inp" type="tel" placeholder="Телефон">
                    <input class="mini_inp" type="number" placeholder="Гостей"> 
                    <input class="mini_inp" type="text" placeholder="Время">
                </form>

                <button>Забронировать</button>
            </div>
        </div>    
    </section>
</body>
</html>
